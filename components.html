<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Components — Household Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Sign-in screen -->
  <div class="auth-card" id="authCard">
    <div class="eyebrow" style="text-align:left;margin-bottom:14px;">Household · Live list</div>
    <h2 id="authTitle">Sign in to view the list</h2>
    <p id="authSub">Enter the email and password you were given. Only invited household accounts can access this list.</p>
    <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="username">
    <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="authBtn" type="button">Sign in</button>
    <div class="error-msg" id="authError"></div>
    <div class="auth-note"><a href="#" id="forgotPasswordLink" style="color:var(--paper-dim);">Forgot your password?</a></div>
  </div>

  <!-- Main app shell (shown once signed in) -->
  <div class="app-shell hidden" id="appWrap">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">Household</div>
      <div id="sidebarNav"></div>
    </nav>

    <div class="page-content">
      <div class="wrap">
        <header>
          <div>
            <div class="eyebrow">Household · Live list</div>
            <h1>Components</h1>
            <p class="sub" id="signedInAs"></p>
          </div>
          <button class="signout-btn" id="signOutBtn" type="button">Sign out</button>
        </header>

        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>

        <div class="list" id="list"></div>

        <form class="add-form" id="addForm">
          <input id="newName" type="text" placeholder="Component name" autocomplete="off" required>
          <input id="newCount" type="number" min="0" step="1" value="1" required>
          <input id="newPartNumber" type="text" placeholder="Part / model number (optional)" autocomplete="off">
          <select id="categorySelect">
            <option value="">Select category…</option>
            <option value="__new__">+ Add new category</option>
          </select>
          <input id="newCategory" type="text" placeholder="New category name" autocomplete="off" class="hidden">
          <textarea id="newNotes" placeholder="Notes (optional)" rows="2" class="full-row"></textarea>
          <button type="submit">Add component</button>
        </form>
        <div class="error-msg" id="errorMsg"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      db, logChange, escapeHtml, initAuthGate, COMPONENTS_DATABASE_NAME
    } from "./app-shared.js";
    import {
      collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, increment
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const listEl = document.getElementById('list');
    const addForm = document.getElementById('addForm');
    const newName = document.getElementById('newName');
    const newCount = document.getElementById('newCount');
    const newPartNumber = document.getElementById('newPartNumber');
    const newNotes = document.getElementById('newNotes');
    const categorySelect = document.getElementById('categorySelect');
    const newCategory = document.getElementById('newCategory');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const errorMsg = document.getElementById('errorMsg');

    const UNCATEGORIZED = 'Uncategorized';
    let knownCategories = []; // derived live from the items currently in the list

    // Toggle the free-text "new category" input when that option is chosen.
    categorySelect.addEventListener('change', () => {
      const isNew = categorySelect.value === '__new__';
      newCategory.classList.toggle('hidden', !isNew);
      if (isNew) newCategory.focus();
    });

    function refreshCategoryOptions(categories) {
      knownCategories = categories;
      const currentValue = categorySelect.value;
      categorySelect.innerHTML = `
        <option value="">Select category…</option>
        ${categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
        <option value="__new__">+ Add new category</option>
      `;
      // Keep the user's current selection if it still exists (e.g. they picked
      // a category while someone else's item is arriving over the live sync).
      if ([...categorySelect.options].some(o => o.value === currentValue)) {
        categorySelect.value = currentValue;
      }
    }

    let listenerStarted = false;
    function startListListener() {
      if (listenerStarted || !db) return;
      listenerStarted = true;
      const itemsCol = collection(db, "components");

      onSnapshot(itemsCol,
        (snapshot) => {
          statusDot.classList.remove('offline');
          statusText.textContent = 'Live — connected';
          const items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          render(items);
          const categories = [...new Set(items.map(i => i.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
          refreshCategoryOptions(categories);
        },
        (err) => {
          statusDot.classList.add('offline');
          statusText.textContent = 'Connection error';
          errorMsg.textContent = err.code === 'permission-denied'
            ? "Your account isn't on the household allowlist yet — ask whoever set this up to add it, and make sure the 'components' collection was added to the Firestore rules."
            : err.message;
        }
      );

      listEl.addEventListener('click', async (e) => {
        const itemEl = e.target.closest('.item');
        if (!itemEl) return;
        const id = itemEl.dataset.id;
        const ref = doc(db, "components", id);
        const itemName = itemEl.dataset.name;
        const category = itemEl.dataset.category || '';
        const partNumber = itemEl.dataset.partnumber || '';
        const countEl = itemEl.querySelector('.count');
        const current = Number(countEl.textContent);
        const logExtra = { database: COMPONENTS_DATABASE_NAME, category, partNumber };
        try {
          if (e.target.classList.contains('inc')) {
            await updateDoc(ref, { count: increment(1) });
            logChange(itemName, current, current + 1, logExtra);
          } else if (e.target.classList.contains('dec')) {
            if (current > 0) {
              await updateDoc(ref, { count: increment(-1) });
              logChange(itemName, current, current - 1, logExtra);
            }
          } else if (e.target.classList.contains('remove-btn')) {
            if (confirm(`Remove "${itemName}" from the list?`)) {
              await deleteDoc(ref);
              logChange(itemName, current, 0, logExtra);
            }
          }
        } catch (err) {
          errorMsg.textContent = 'Could not save that change — check your connection and try again.';
        }
      });

      addForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = newName.value.trim();
        const count = parseInt(newCount.value, 10) || 0;
        const partNumber = newPartNumber.value.trim();
        const notes = newNotes.value.trim();

        let category;
        if (categorySelect.value === '__new__') {
          category = newCategory.value.trim();
          if (!category) { errorMsg.textContent = 'Enter a name for the new category, or pick an existing one.'; return; }
        } else {
          category = categorySelect.value || UNCATEGORIZED;
        }
        if (!name) return;

        try {
          await addDoc(itemsCol, { name, count, category, partNumber, notes });
          logChange(name, 0, count, { database: COMPONENTS_DATABASE_NAME, category, partNumber });
          newName.value = '';
          newCount.value = '1';
          newPartNumber.value = '';
          newNotes.value = '';
          newCategory.value = '';
          newCategory.classList.add('hidden');
          categorySelect.value = '';
          newName.focus();
        } catch (err) {
          errorMsg.textContent = 'Could not add that component — check your connection and try again.';
        }
      });
    }

    function render(items) {
      errorMsg.textContent = '';
      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty">No components yet — add your first one below.</div>`;
        return;
      }

      // Group by category, then sort categories and items within each group.
      const groups = new Map();
      items.forEach(item => {
        const cat = item.category || UNCATEGORIZED;
        if (!groups.has(cat)) groups.set(cat, []);
        groups.get(cat).push(item);
      });
      const sortedCategories = [...groups.keys()].sort((a, b) => a.localeCompare(b));

      listEl.innerHTML = sortedCategories.map(cat => {
        const catItems = groups.get(cat).sort((a, b) => a.name.localeCompare(b.name));
        return `
          <div class="category-group">
            <h2 class="category-heading">${escapeHtml(cat)} <span style="opacity:.6;">(${catItems.length})</span></h2>
            ${catItems.map(item => `
              <div class="item" data-id="${item.id}" data-name="${escapeHtml(item.name)}" data-category="${escapeHtml(item.category || '')}" data-partnumber="${escapeHtml(item.partNumber || '')}">
                <div class="item-main">
                  <div class="item-name">${escapeHtml(item.name)}</div>
                  ${item.partNumber ? `<div class="item-meta">Part #: ${escapeHtml(item.partNumber)}</div>` : ''}
                  ${item.notes ? `<div class="item-meta">${escapeHtml(item.notes)}</div>` : ''}
                </div>
                <div class="stepper">
                  <button type="button" class="dec" aria-label="Use one ${escapeHtml(item.name)}">−</button>
                  <div class="count">${item.count}</div>
                  <button type="button" class="inc" aria-label="Add one ${escapeHtml(item.name)}">+</button>
                </div>
                <button type="button" class="remove-btn" aria-label="Remove ${escapeHtml(item.name)}">✕</button>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    initAuthGate({ activePage: 'components.html', onSignedIn: startListListener });
  </script>
</body>
</html>
