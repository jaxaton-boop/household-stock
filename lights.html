<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lights — Household Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Sign-in screen -->
  <div class="auth-card" id="authCard">
    <div class="eyebrow" style="text-align:left;margin-bottom:14px;">Household · Live list</div>
    <h2 id="authTitle">Sign in to view the list</h2>
    <p id="authSub">Enter the email and password you were given. Only invited household accounts can access this list.</p>
    <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="username">
    <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="authBtn" type="button">Sign in</button>
    <div class="error-msg" id="authError"></div>
    <div class="auth-note"><a href="#" id="forgotPasswordLink" style="color:var(--paper-dim);">Forgot your password?</a></div>
  </div>

  <!-- Main app shell (shown once signed in) -->
  <div class="app-shell hidden" id="appWrap">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">Household</div>
      <div id="sidebarNav"></div>
    </nav>

    <div class="page-content">
      <div class="wrap">
        <header>
          <div>
            <div class="eyebrow">Household · Live list</div>
            <h1>Lights</h1>
            <p class="sub" id="signedInAs"></p>
          </div>
          <button class="signout-btn" id="signOutBtn" type="button">Sign out</button>
        </header>

        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>

        <!-- Tabs: room/group control is primary; individual lights is secondary -->
        <div class="tabbar" id="lightsTabbar">
          <button type="button" class="tab-btn active" data-tab="groups">Groups</button>
          <button type="button" class="tab-btn" data-tab="lights">Lights</button>
        </div>

        <div class="tab-panel hidden" id="tabPanelLights">
          <div class="lights-grid" id="lightsGrid">Loading…</div>
        </div>

        <div class="tab-panel" id="tabPanelGroups">
          <div class="groups-toolbar">
            <button type="button" class="edit-layout-btn" id="editLayoutBtn">Edit layout</button>
          </div>
          <div class="lights-grid" id="groupsGrid">Loading…</div>
        </div>

        <div class="error-msg" id="errorMsg"></div>
      </div>
    </div>

    <div class="toast" id="groupToast"></div>
  </div>

  <script type="module">
    import {
      auth, rtdb, escapeHtml, initAuthGate,
      writeLightDesired, rgbToHex, pickTextColors
    } from "./app-shared.js";
    import {
      ref, onValue, update, remove, push, set, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const errorMsg = document.getElementById('errorMsg');

    // ============================================================
    // Toast: a short-lived confirmation banner, currently used to
    // confirm a group's change has reached every contactable light.
    // ============================================================
    const toastEl = document.getElementById('groupToast');
    let toastTimeout = null;
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('visible');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toastEl.classList.remove('visible'), 5000);
    }

    // ============================================================
    // Tabs
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('tabPanelLights').classList.toggle('hidden', tab !== 'lights');
        document.getElementById('tabPanelGroups').classList.toggle('hidden', tab !== 'groups');
      });
    });

    // ============================================================
    // "Presets and custom" dropdown - shared by light and group cards
    //
    // This replaced the native <input type="color"> picker (2026-10-13).
    // That picker is a browser popup attached to its input element, and
    // both grids are rebuilt with innerHTML on every RTDB update - which
    // arrive constantly, because the ESP32 writes "reported" back after
    // every change. Each rebuild destroyed the input, so the popup closed
    // a moment after opening, or as soon as you picked anything (your
    // own write -> echo -> rebuild).
    //
    // The dropdown lives inside the card, so it survives rebuilds by:
    //   1. remembering which cards are expanded (expandedCards), and
    //   2. holding back rebuilds while a slider is being dragged
    //      (requestRender / drag tracking below), then catching up.
    // ============================================================

    // Preset scenes. Tapping one also turns the light/group on.
    // Edit freely - name, colour (0-255) and brightness (1-100).
    const PRESETS = [
      { name: 'Warm white',  r: 255, g: 180, b: 107, brightness: 80 },
      { name: 'Soft white',  r: 255, g: 214, b: 170, brightness: 90 },
      { name: 'Daylight',    r: 240, g: 245, b: 255, brightness: 100 },
      { name: 'Reading',     r: 255, g: 228, b: 196, brightness: 100 },
      { name: 'Relax',       r: 255, g: 150, b: 60,  brightness: 45 },
      { name: 'Night light', r: 255, g: 110, b: 30,  brightness: 10 },
      { name: 'Red',         r: 255, g: 0,   b: 0,   brightness: 100 },
      { name: 'Ocean',       r: 0,   g: 120, b: 255, brightness: 100 },
      { name: 'Forest',      r: 40,  g: 200, b: 80,  brightness: 100 },
      { name: 'Purple',      r: 150, g: 60,  b: 255, brightness: 100 }
    ];

    // Which cards have the dropdown open, keyed "light:<id>" / "group:<id>".
    // A Set so several can be open at once.
    const expandedCards = new Set();
    const cardKey = (kind, id) => `${kind}:${id}`;

    // Hue/saturation <-> RGB. Value is fixed at full: brightness is its
    // own control, so the colour sliders only pick the colour itself.
    function hsToRgb(h, s) {
      const c = s / 100;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = 1 - c;
      let r1, g1, b1;
      if (h < 60)       [r1, g1, b1] = [c, x, 0];
      else if (h < 120) [r1, g1, b1] = [x, c, 0];
      else if (h < 180) [r1, g1, b1] = [0, c, x];
      else if (h < 240) [r1, g1, b1] = [0, x, c];
      else if (h < 300) [r1, g1, b1] = [x, 0, c];
      else              [r1, g1, b1] = [c, 0, x];
      return {
        r: Math.round((r1 + m) * 255),
        g: Math.round((g1 + m) * 255),
        b: Math.round((b1 + m) * 255)
      };
    }

    function rgbToHs(r, g, b) {
      const rn = r / 255, gn = g / 255, bn = b / 255;
      const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
      const d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === rn) h = 60 * (((gn - bn) / d) % 6);
        else if (max === gn) h = 60 * ((bn - rn) / d + 2);
        else h = 60 * ((rn - gn) / d + 4);
      }
      if (h < 0) h += 360;
      const s = max === 0 ? 0 : d / max;
      return { h: Math.round(h) % 360, s: Math.round(s * 100) };
    }

    // Each slider's track and thumb are coloured live through CSS
    // variables (--track, --thumb - see .lc-range in styles.css):
    //   Hue        - fixed rainbow track; thumb shows the pure hue
    //   Saturation - white -> current hue; thumb shows the actual colour
    //   Brightness - near-black -> current colour; thumb dims with it
    function sliderStyles(h, s, bri) {
      const { r, g, b } = hsToRgb(h, s);
      const hex = rgbToHex(r, g, b);
      const k = 0.15 + 0.85 * (bri / 100); // never fully black, so the thumb stays visible
      const dim = rgbToHex(r * k, g * k, b * k);
      return {
        hex,
        hue: `--thumb: hsl(${h} 100% 50%);`,
        sat: `--track: linear-gradient(to right, #ffffff, hsl(${h} 100% 50%)); --thumb: ${hex};`,
        brightness: `--track: linear-gradient(to right, #111111, ${hex}); --thumb: ${dim};`
      };
    }

    // Re-colours one card's sliders and previews from their current values.
    function applySliderStyles(card) {
      const h = Number(card.querySelector('[data-role="hue"]').value);
      const s = Number(card.querySelector('[data-role="sat"]').value);
      const bri = Number(card.querySelector('[data-role="brightness"]').value);
      const st = sliderStyles(h, s, bri);
      ['hue', 'sat', 'brightness'].forEach(role => {
        const el = card.querySelector(`[data-role="${role}"]`);
        if (el) el.style.cssText = st[role];
      });
      card.querySelectorAll('.lc-preview, .lc-summary-swatch').forEach(el => { el.style.background = st.hex; });
    }

    // The collapsed summary button plus the expandable panel. Used inside
    // both light cards and group cards.
    function presetsAndCustomHtml(kind, id, name, { on, brightness, r, g, b }) {
      const expanded = expandedCards.has(cardKey(kind, id));
      const hex = rgbToHex(r, g, b);
      const { h, s } = rgbToHs(r, g, b);
      const st = sliderStyles(h, s, brightness);
      const safeName = escapeHtml(name);

      // Presets are plain colour squares; the name shows as a caption
      // next to "Presets" on hover/focus, and as a tooltip.
      let activeName = '';
      const presetTiles = PRESETS.map((p, i) => {
        const active = p.r === r && p.g === g && p.b === b && p.brightness === brightness;
        if (active) activeName = p.name;
        const tick = pickTextColors(p.r, p.g, p.b).paper;
        return `
          <button type="button" class="lc-swatch ${active ? 'active' : ''}" data-role="preset" data-preset="${i}"
            data-name="${escapeHtml(p.name)}" title="${escapeHtml(p.name)}" aria-label="${escapeHtml(p.name)} preset"
            aria-pressed="${active}" style="--c: ${rgbToHex(p.r, p.g, p.b)}; --tick: ${tick};">
            <svg class="lc-swatch-tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7"/></svg>
          </button>
        `;
      }).join('');

      return `
        <button type="button" class="lc-summary" data-role="expand" aria-expanded="${expanded}">
          <span class="lc-summary-swatch" style="background:${hex}"></span>
          <span class="lc-summary-label">Presets and custom</span>
          <span class="lc-summary-meta">${on ? `${brightness}%` : 'Off'}</span>
          <svg class="lc-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lc-panel ${expanded ? '' : 'hidden'} ${on ? '' : 'dimmed'}">
          <div class="lc-section-label">
            Presets <span class="lc-preset-name" data-active-name="${escapeHtml(activeName)}">${escapeHtml(activeName)}</span>
          </div>
          <div class="lc-swatch-grid">${presetTiles}</div>

          <div class="lc-section-label lc-section-label-custom">
            Custom <span class="lc-preview" style="background:${hex}"></span>
          </div>
          <div class="lc-sliders">
            <div class="lc-slider">
              <div class="lc-slider-head"><span class="control-label">Hue</span><span class="lc-value" data-value-for="hue">${h}°</span></div>
              <input type="range" class="lc-range lc-range-hue" data-role="hue" min="0" max="359" value="${h}" style="${st.hue}" aria-label="Hue for ${safeName}">
            </div>
            <div class="lc-slider">
              <div class="lc-slider-head"><span class="control-label">Saturation</span><span class="lc-value" data-value-for="sat">${s}%</span></div>
              <input type="range" class="lc-range" data-role="sat" min="0" max="100" value="${s}" style="${st.sat}" aria-label="Saturation for ${safeName}">
            </div>
            <div class="lc-slider">
              <div class="lc-slider-head"><span class="control-label">Brightness</span><span class="lc-value" data-value-for="brightness">${brightness}%</span></div>
              <input type="range" class="lc-range" data-role="brightness" min="1" max="100" value="${brightness}" style="${st.brightness}" aria-label="Brightness for ${safeName}">
            </div>
          </div>
        </div>
      `;
    }

    // Wires the dropdown's controls on one grid. onWrite(id, patch) is
    // writeDesired for lights or writeGroupDesired for groups.
    function wirePresetsAndCustom(grid, kind, onWrite) {
      grid.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-role="expand"], [data-role="preset"]');
        if (!btn) return;
        const card = btn.closest('.light-card[data-id]');
        if (!card) return;
        const id = card.dataset.id;

        if (btn.dataset.role === 'expand') {
          const key = cardKey(kind, id);
          const nowOpen = !expandedCards.has(key);
          if (nowOpen) expandedCards.add(key); else expandedCards.delete(key);
          // Toggle in place - no rebuild needed just to open/close.
          btn.setAttribute('aria-expanded', String(nowOpen));
          card.querySelector('.lc-panel')?.classList.toggle('hidden', !nowOpen);
          return;
        }

        const p = PRESETS[Number(btn.dataset.preset)];
        if (p) onWrite(id, { on: true, r: p.r, g: p.g, b: p.b, brightness: p.brightness });
      });

      // While dragging: update labels and previews only (no writes).
      grid.addEventListener('input', (e) => {
        const role = e.target.dataset?.role;
        if (role !== 'hue' && role !== 'sat' && role !== 'brightness') return;
        const card = e.target.closest('.light-card[data-id]');
        if (!card) return;

        const label = card.querySelector(`[data-value-for="${role}"]`);
        if (label) label.textContent = role === 'hue' ? `${e.target.value}°` : `${e.target.value}%`;

        applySliderStyles(card);
        if (role === 'brightness') {
          const meta = card.querySelector('.lc-summary-meta');
          if (meta && meta.textContent !== 'Off') meta.textContent = `${e.target.value}%`;
        }
      });

      // Preset caption: show the hovered/focused square's name, and fall
      // back to the active preset's name (or nothing) when you move away.
      const showPresetName = (e) => {
        const tile = e.target.closest?.('.lc-swatch');
        const card = e.target.closest?.('.light-card[data-id]');
        const caption = card?.querySelector('.lc-preset-name');
        if (!caption) return;
        caption.textContent = tile ? tile.dataset.name : caption.dataset.activeName;
      };
      const resetPresetName = (e) => {
        if (!e.target.closest?.('.lc-swatch')) return;
        const caption = e.target.closest('.light-card[data-id]')?.querySelector('.lc-preset-name');
        if (caption) caption.textContent = caption.dataset.activeName;
      };
      grid.addEventListener('mouseover', showPresetName);
      grid.addEventListener('focusin', showPresetName);
      grid.addEventListener('mouseout', resetPresetName);
      grid.addEventListener('focusout', resetPresetName);

      // On release: one write per change, same as the old controls
      // (keeps RTDB bandwidth down - see README "Known limitations").
      grid.addEventListener('change', (e) => {
        const role = e.target.dataset?.role;
        if (role !== 'hue' && role !== 'sat' && role !== 'brightness') return;
        const card = e.target.closest('.light-card[data-id]');
        if (!card) return;
        const id = card.dataset.id;

        if (role === 'brightness') {
          onWrite(id, { brightness: Number(e.target.value) });
        } else {
          const h = Number(card.querySelector('[data-role="hue"]').value);
          const s = Number(card.querySelector('[data-role="sat"]').value);
          onWrite(id, hsToRgb(h, s));
        }
      });
    }

    // ------------------------------------------------------------
    // Render guard: never rebuild a grid mid-drag.
    // A rebuild during a drag would yank the slider out from under
    // your finger. Incoming updates are held while a pointer is down
    // on a slider, then applied shortly after release (the delay lets
    // the slider's own "change" event fire and write first).
    // ------------------------------------------------------------
    let dragging = false;
    let dragToken = 0;
    const pendingRenders = new Set();
    const RENDER_RESUME_DELAY_MS = 250;

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest?.('.lc-panel input[type="range"]')) {
        dragging = true;
        dragToken++;
      }
    }, true);

    function endDrag() {
      if (!dragging) return;
      const token = dragToken;
      setTimeout(() => {
        if (token !== dragToken) return; // a new drag started in the meantime
        dragging = false;
        const queued = [...pendingRenders];
        pendingRenders.clear();
        queued.forEach(requestRender);
      }, RENDER_RESUME_DELAY_MS);
    }
    window.addEventListener('pointerup', endDrag, true);
    window.addEventListener('pointercancel', endDrag, true);

    function requestRender(which) {
      if (dragging) { pendingRenders.add(which); return; }
      if (which === 'lights') renderLightsNow();
      else renderGroupsNow();
    }

    // Rebuilds a grid but puts keyboard focus back on the same control
    // afterwards, so arrow-key adjustments aren't interrupted either.
    function rebuildKeepingFocus(container, html) {
      const active = document.activeElement;
      let selector = null;
      if (active && container.contains(active) && active.dataset?.role) {
        const card = active.closest('.light-card[data-id]');
        if (card) {
          selector = `.light-card[data-id="${CSS.escape(card.dataset.id)}"] [data-role="${active.dataset.role}"]`;
          if (active.dataset.preset !== undefined) selector += `[data-preset="${active.dataset.preset}"]`;
        }
      }
      container.innerHTML = html;
      if (selector) container.querySelector(selector)?.focus({ preventScroll: true });
    }

    // ============================================================
    // Individual lights
    // ============================================================
    const gridEl = document.getElementById('lightsGrid');
    let lightsData = {}; // kept around so the Groups tab can show light names in "Assign lights"
    let lightsListenerStarted = false;

    function startLightsListener() {
      if (lightsListenerStarted || !rtdb) {
        if (!rtdb) errorMsg.textContent = 'Realtime Database isn\'t configured — see README_LIGHTS.md.';
        return;
      }
      lightsListenerStarted = true;

      const lightsRef = ref(rtdb, 'lights');
      onValue(lightsRef,
        (snapshot) => {
          statusDot.classList.remove('offline');
          statusText.textContent = 'Live — connected';
          lightsData = snapshot.val() || {};
          requestRender('lights');
          requestRender('groups'); // keep "Assign lights" names/availability in sync
          checkPendingGroupApplications();
        },
        (err) => {
          statusDot.classList.add('offline');
          statusText.textContent = 'Connection error';
          gridEl.innerHTML = '';
          errorMsg.textContent = err.code === 'PERMISSION_DENIED'
            ? "Your account isn't on the lights allowlist yet — ask whoever set this up to add it."
            : `Error loading lights: ${err.message}`;
        }
      );
    }

    // On/off switch (the dropdown's controls are wired separately below).
    gridEl.addEventListener('change', (e) => {
      if (!e.target.classList.contains('light-toggle')) return;
      const card = e.target.closest('.light-card[data-id]');
      if (card) writeDesired(card.dataset.id, { on: e.target.checked });
    });
    wirePresetsAndCustom(gridEl, 'light', writeDesired);

    // writeDesired wraps the shared writeLightDesired helper (from
    // app-shared.js) purely to surface a page-local error message on
    // failure.
    function writeDesired(hueId, patch) {
      errorMsg.textContent = '';
      writeLightDesired(hueId, patch).catch(() => {
        errorMsg.textContent = 'Could not save that change — check your connection and try again.';
      });
    }

    function renderLightsNow() {
      const lightsObj = lightsData;
      const ids = Object.keys(lightsObj);
      if (ids.length === 0) {
        gridEl.innerHTML = `<div class="empty">No lights found yet — make sure the ESP32 controller is powered on and connected.</div>`;
        return;
      }

      ids.sort((a, b) => {
        const nameA = lightsObj[a]?.meta?.name || a;
        const nameB = lightsObj[b]?.meta?.name || b;
        return nameA.localeCompare(nameB);
      });

      const html = ids.map(id => {
        const light = lightsObj[id] || {};
        const meta = light.meta || {};
        const desired = light.desired || {};
        const reported = light.reported || {};

        const name = meta.name || `Light ${id}`;
        const state = {
          on: desired.on ?? false,
          brightness: desired.brightness ?? 100,
          r: desired.r ?? 255,
          g: desired.g ?? 255,
          b: desired.b ?? 255
        };
        const statusLine = reportedStatusLine(desired, reported);
        const statusIsError = reported.commError === true;

        return `
          <div class="light-card" data-id="${id}">
            <div class="light-card-top">
              <div class="light-name">${escapeHtml(name)}</div>
              <label class="switch">
                <input type="checkbox" class="light-toggle" data-role="power" ${state.on ? 'checked' : ''} aria-label="Turn ${escapeHtml(name)} on or off">
                <span class="slider-track"></span>
              </label>
            </div>
            ${presetsAndCustomHtml('light', id, name, state)}
            <div class="light-status ${statusIsError ? 'error' : ''}">${escapeHtml(statusLine)}</div>
          </div>
        `;
      }).join('');

      rebuildKeepingFocus(gridEl, html);
    }

    function reportedStatusLine(desired, reported) {
      if (!reported || reported.appliedAt === undefined) return 'Waiting for device…';
      if (reported.commError) return "Bridge can't reach this light — check it's powered on and in range";
      const matches = reported.on === (desired.on ?? false)
        && reported.brightness === (desired.brightness ?? 100)
        && reported.r === (desired.r ?? 255)
        && reported.g === (desired.g ?? 255)
        && reported.b === (desired.b ?? 255);
      return matches ? 'Applied' : 'Applying…';
    }

    // ============================================================
    // Groups (rooms/areas made of one or more lights)
    //
    // A group is a website-only concept - it has no equivalent on the
    // ESP32. Changing a group's on/off, brightness, or colour just fans
    // that same write out to each assigned light's own
    // /lights/{id}/desired node (via writeDesired, above), so the
    // ESP32's existing poll -> apply -> report loop applies it exactly
    // as if each light had been changed individually. The group also
    // keeps its own "last set" values under /groups/{id}/desired purely
    // so its own card has something to display - it does not attempt to
    // read back or average what its member bulbs are actually reporting.
    // ============================================================
    const groupsGrid = document.getElementById('groupsGrid');
    const editLayoutBtn = document.getElementById('editLayoutBtn');

    let groupsData = {};
    let groupsListenerStarted = false;
    let editMode = false;
    let addingGroup = false;
    let openAssignMenuId = null; // which group's "Assign lights" checklist is open, if any
    let pendingGroupApplications = new Map(); // groupId -> { target, memberIds, startedAt }
    const GROUP_APPLY_GIVE_UP_MS = 20000; // stop waiting silently if nothing ever reports back

    function startGroupsListener() {
      if (groupsListenerStarted || !rtdb) return;
      groupsListenerStarted = true;

      const groupsRef = ref(rtdb, 'groups');
      onValue(groupsRef,
        (snapshot) => {
          groupsData = snapshot.val() || {};
          requestRender('groups');
        },
        (err) => {
          errorMsg.textContent = err.code === 'PERMISSION_DENIED'
            ? "Your account isn't on the lights allowlist yet — ask whoever set this up to add it."
            : `Error loading groups: ${err.message}`;
        }
      );
    }

    editLayoutBtn.addEventListener('click', () => {
      editMode = !editMode;
      editLayoutBtn.textContent = editMode ? 'Done editing' : 'Edit layout';
      editLayoutBtn.classList.toggle('active', editMode);
      if (!editMode) { addingGroup = false; openAssignMenuId = null; }
      renderGroupsNow();
    });

    function writeGroupDesired(groupId, patch) {
      errorMsg.textContent = '';
      const currentDesired = groupsData[groupId]?.desired || {};
      const target = { ...currentDesired, ...patch }; // the full state we expect every member light to reach

      // Record the group's own "last set" values, for the group card's display.
      update(ref(rtdb, `groups/${groupId}/desired`), {
        ...patch,
        updatedBy: auth?.currentUser?.email || 'unknown',
        updatedAt: serverTimestamp()
      }).catch(() => {
        errorMsg.textContent = 'Could not save that change — check your connection and try again.';
      });

      // Fan the same change out to every light currently assigned to
      // this group - reusing the exact same per-light write the Lights
      // tab uses, so nothing new needs to happen on the ESP32 side.
      const memberIds = Object.keys(groupsData[groupId]?.lightIds || {});
      memberIds.forEach(lightId => writeDesired(lightId, patch));

      // Watch for confirmation that this change actually reached every
      // contactable light (see checkPendingGroupApplications). A later
      // change to the same group overwrites this entry, so only the
      // final settled state gets a toast.
      if (memberIds.length > 0) {
        pendingGroupApplications.set(groupId, { target, memberIds, startedAt: Date.now() });
      }
    }

    // Fires the "applied" toast once every member light of a pending
    // group change has either matched the target state or reported it
    // can't be reached (commError).
    function checkPendingGroupApplications() {
      const now = Date.now();
      for (const [groupId, pending] of pendingGroupApplications.entries()) {
        if (now - pending.startedAt > GROUP_APPLY_GIVE_UP_MS) {
          pendingGroupApplications.delete(groupId); // give up quietly - e.g. the whole unit is offline
          continue;
        }

        const { target, memberIds } = pending;
        let allResolved = true;
        let matchedCount = 0;
        let errorCount = 0;

        for (const lightId of memberIds) {
          const reported = lightsData[lightId]?.reported;
          if (!reported || reported.appliedAt === undefined) { allResolved = false; continue; }
          if (reported.commError) { errorCount++; continue; }
          const matches = reported.on === (target.on ?? false)
            && reported.brightness === (target.brightness ?? 100)
            && reported.r === (target.r ?? 255)
            && reported.g === (target.g ?? 255)
            && reported.b === (target.b ?? 255);
          if (matches) matchedCount++;
          else allResolved = false;
        }

        if (!allResolved) continue;

        pendingGroupApplications.delete(groupId);
        const groupName = groupsData[groupId]?.name || 'Group';
        const total = memberIds.length;
        const message = errorCount === 0
          ? `${groupName}: applied to all ${matchedCount} light${matchedCount === 1 ? '' : 's'}`
          : `${groupName}: applied to ${matchedCount} of ${total} light${total === 1 ? '' : 's'} (${errorCount} unreachable)`;
        showToast(message);
      }
    }

    function renderGroupsNow() {
      const ids = Object.keys(groupsData);
      ids.sort((a, b) => (groupsData[a]?.name || '').localeCompare(groupsData[b]?.name || ''));

      // A rebuild would also wipe a half-typed new group name, so carry
      // it (and whether it had focus) across.
      const nameInput = document.getElementById('newGroupNameInput');
      const typedName = nameInput?.value ?? '';
      const nameHadFocus = nameInput && document.activeElement === nameInput;

      let html = '';
      if (ids.length === 0 && !editMode) {
        html = `<div class="empty">No groups yet — tap "Edit layout" to add your first one.</div>`;
      } else {
        html = ids.map(id => groupCardHtml(id, groupsData[id] || {})).join('');
      }
      if (editMode) {
        html += addGroupTileHtml();
      }
      rebuildKeepingFocus(groupsGrid, html);

      if (addingGroup) {
        const newInput = document.getElementById('newGroupNameInput');
        if (newInput) {
          newInput.value = typedName;
          if (nameHadFocus || !nameInput) newInput.focus();
        }
      }
    }

    function groupCardHtml(id, group) {
      const name = group.name || 'Unnamed group';
      const desired = group.desired || {};
      const state = {
        on: desired.on ?? false,
        brightness: desired.brightness ?? 100,
        r: desired.r ?? 255,
        g: desired.g ?? 255,
        b: desired.b ?? 255
      };
      const hex = rgbToHex(state.r, state.g, state.b);
      const memberIds = Object.keys(group.lightIds || {});
      const metaText = memberIds.length === 0
        ? 'No lights assigned yet'
        : `${memberIds.length} light${memberIds.length === 1 ? '' : 's'} assigned`;
      const assignOpen = openAssignMenuId === id;

      const editRow = editMode ? `
        <div class="group-edit-row">
          <button type="button" class="assign-lights-btn">Assign lights</button>
          <button type="button" class="delete-group-btn">Delete group</button>
        </div>
        <div class="assign-lights-menu ${assignOpen ? '' : 'hidden'}">
          ${assignLightsChecklistHtml(memberIds)}
        </div>
      ` : '';

      // Shade the card with the group's own colour when it's on. The
      // readable text colours go in --tint-* variables, which styles.css
      // applies only to the parts sitting directly on the coloured
      // background - the dropdown panel and assign menu keep the theme's
      // normal colours, since they have their own solid background.
      let cardStyle = '';
      let cardClass = 'light-card group-card';
      if (state.on) {
        const { paper, paperDim } = pickTextColors(state.r, state.g, state.b);
        cardStyle = ` style="background-color: ${hex}; --tint-paper: ${paper}; --tint-paper-dim: ${paperDim};"`;
        cardClass += ' group-card-colored';
      }

      return `
        <div class="${cardClass}" data-id="${id}"${cardStyle}>
          <div class="light-card-top">
            <div class="light-name">${escapeHtml(name)}</div>
            <label class="switch">
              <input type="checkbox" class="light-toggle group-toggle" data-role="power" ${state.on ? 'checked' : ''} aria-label="Turn ${escapeHtml(name)} on or off">
              <span class="slider-track"></span>
            </label>
          </div>
          ${presetsAndCustomHtml('group', id, name, state)}
          <div class="group-meta">${escapeHtml(metaText)}</div>
          ${editRow}
        </div>
      `;
    }

    function assignLightsChecklistHtml(memberIds) {
      const lightIds = Object.keys(lightsData);
      if (lightIds.length === 0) {
        return `<div class="assign-empty">No lights registered yet — make sure the ESP32 controller is powered on.</div>`;
      }
      lightIds.sort((a, b) => (lightsData[a]?.meta?.name || a).localeCompare(lightsData[b]?.meta?.name || b));
      return lightIds.map(lid => {
        const name = lightsData[lid]?.meta?.name || `Light ${lid}`;
        const checked = memberIds.includes(lid);
        return `
          <label class="assign-lights-row">
            <input type="checkbox" class="assign-light-checkbox" data-light-id="${lid}" ${checked ? 'checked' : ''}>
            <span>${escapeHtml(name)}</span>
          </label>
        `;
      }).join('');
    }

    function addGroupTileHtml() {
      if (addingGroup) {
        return `
          <div class="light-card group-card add-group-card">
            <div class="light-name">New group</div>
            <input type="text" id="newGroupNameInput" class="add-group-input" placeholder="Room or group name" maxlength="40">
            <div class="group-edit-row">
              <button type="button" id="createGroupBtn">Create</button>
              <button type="button" id="cancelGroupBtn">Cancel</button>
            </div>
          </div>
        `;
      }
      return `<button type="button" class="add-group-tile" id="addGroupTile">+ Add group</button>`;
    }

    async function createGroup() {
      const input = document.getElementById('newGroupNameInput');
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      try {
        const newRef = push(ref(rtdb, 'groups'));
        await set(newRef, {
          name,
          desired: { on: false, brightness: 100, r: 255, g: 255, b: 255 },
          createdAt: serverTimestamp()
        });
        addingGroup = false;
        renderGroupsNow();
      } catch (err) {
        errorMsg.textContent = 'Could not create that group — check your connection and try again.';
      }
    }

    groupsGrid.addEventListener('click', async (e) => {
      if (e.target.closest('#addGroupTile')) {
        addingGroup = true;
        renderGroupsNow();
        return;
      }
      if (e.target.closest('#createGroupBtn')) {
        createGroup();
        return;
      }
      if (e.target.closest('#cancelGroupBtn')) {
        addingGroup = false;
        renderGroupsNow();
        return;
      }

      const card = e.target.closest('.group-card');
      if (!card) return;
      const groupId = card.dataset.id;

      if (e.target.classList.contains('delete-group-btn')) {
        const name = groupsData[groupId]?.name || 'this group';
        if (confirm(`Delete "${name}"? This only removes the group — its lights aren't affected.`)) {
          try {
            await remove(ref(rtdb, `groups/${groupId}`));
            if (openAssignMenuId === groupId) openAssignMenuId = null;
            expandedCards.delete(cardKey('group', groupId));
          } catch (err) {
            errorMsg.textContent = 'Could not delete that group — check your connection and try again.';
          }
        }
        return;
      }

      if (e.target.classList.contains('assign-lights-btn')) {
        openAssignMenuId = (openAssignMenuId === groupId) ? null : groupId;
        renderGroupsNow();
        return;
      }
    });

    // On/off switch and "Assign lights" checkboxes (the dropdown's
    // controls are wired separately below).
    groupsGrid.addEventListener('change', (e) => {
      const card = e.target.closest('.group-card');
      if (!card) return;
      const groupId = card.dataset.id;

      if (e.target.classList.contains('group-toggle')) {
        writeGroupDesired(groupId, { on: e.target.checked });
      } else if (e.target.classList.contains('assign-light-checkbox')) {
        const lightId = e.target.dataset.lightId;
        const writeFn = e.target.checked
          ? update(ref(rtdb, `groups/${groupId}/lightIds`), { [lightId]: true })
          : remove(ref(rtdb, `groups/${groupId}/lightIds/${lightId}`));
        writeFn.catch(() => {
          errorMsg.textContent = 'Could not update that group\'s lights — check your connection and try again.';
        });
      }
    });
    wirePresetsAndCustom(groupsGrid, 'group', writeGroupDesired);

    // ============================================================
    // Auth gate: start both listeners once signed in
    // ============================================================
    initAuthGate({
      activePage: 'lights.html',
      onSignedIn: () => {
        startLightsListener();
        startGroupsListener();
      }
    });
  </script>
</body>
</html>
