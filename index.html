<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #23281f;
    --surface: #2c3226;
    --surface-raised: #343b2c;
    --border: #454d3c;
    --paper: #ede6d6;
    --paper-dim: #a9a190;
    --accent: #7fa06f;
    --accent-bright: #9fc98a;
    --danger: #c0604a;
    --danger-bright: #d97a63;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(159,201,138,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(159,201,138,0.05), transparent 40%);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-bright);
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--paper-dim); font-size: 14px; margin: 0; }

  .signout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--paper-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .signout-btn:hover { color: var(--paper); border-color: var(--paper-dim); }

  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--paper-dim);
    margin: 14px 0 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-bright); }
  .dot.offline { background: var(--danger-bright); }

  .list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }

  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  .item::before {
    content: '';
    position: absolute;
    left: 0; top: 10px; bottom: 10px;
    width: 3px;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
  }
  .item-name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .stepper button {
    width: 34px; height: 34px;
    background: transparent;
    border: none;
    color: var(--paper);
    font-size: 18px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }
  .stepper button:hover { background: rgba(159,201,138,0.15); }
  .stepper button:active { background: rgba(159,201,138,0.28); }
  .count {
    min-width: 36px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
  }
  .remove-btn {
    width: 32px; height: 32px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--danger-bright);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    flex-shrink: 0;
  }
  .remove-btn:hover { background: rgba(192,96,74,0.15); border-color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--paper-dim);
    font-size: 13px;
    padding: 30px 10px;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .add-form input {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--paper);
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .add-form input:focus { outline: 2px solid var(--accent-bright); outline-offset: 1px; }
  #newName { flex: 1; min-width: 140px; }
  #newCount { width: 70px; font-family: 'IBM Plex Mono', monospace; }
  .add-form button {
    background: var(--accent);
    border: none;
    color: #16210f;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .add-form button:hover { background: var(--accent-bright); }
  .add-form button:disabled { opacity: 0.5; cursor: default; }

  .error-msg {
    color: var(--danger-bright);
    font-size: 12.5px;
    margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* --- History log --- */
  .history-section { margin-top: 30px; }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .history-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--paper-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .download-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--paper-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 6px 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .download-btn:hover { color: var(--paper); border-color: var(--paper-dim); }
  .download-btn:disabled { opacity: 0.4; cursor: default; }
  .history-log {
    background: #1a1e15;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    max-height: 260px;
    overflow-y: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--paper-dim);
    white-space: pre-wrap;
    word-break: break-all;
  }
  .history-log .empty { border: none; padding: 8px 0; text-align: left; }

  /* --- Sign-in screen --- */
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    max-width: 420px;
    margin: 60px auto 0;
    text-align: center;
  }
  .auth-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    margin: 0 0 8px;
  }
  .auth-card p { color: var(--paper-dim); font-size: 13.5px; margin: 0 0 20px; line-height: 1.5; }
  .auth-card input {
    width: 100%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--paper);
    padding: 11px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .auth-card input:focus { outline: 2px solid var(--accent-bright); outline-offset: 1px; }
  .auth-card button {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #16210f;
    font-weight: 600;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .auth-card button:hover { background: var(--accent-bright); }
  .auth-card button:disabled { opacity: 0.5; cursor: default; }
  .auth-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--paper-dim);
    margin-top: 16px;
  }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: no-preference) {
    .item { transition: transform 0.15s ease, opacity 0.15s ease; }
  }
</style>
</head>
<body>

  <!-- Sign-in screen -->
  <div class="auth-card" id="authCard">
    <div class="eyebrow" style="text-align:left;margin-bottom:14px;">Household · Live list</div>
    <h2 id="authTitle">Sign in to view the list</h2>
    <p id="authSub">Enter your email and we'll send you a sign-in link. Only invited household emails can access this list.</p>
    <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email">
    <button id="authBtn" type="button">Send me a sign-in link</button>
    <div class="error-msg" id="authError"></div>
    <div class="auth-note" id="authNote"></div>
  </div>

  <!-- Main app (shown once signed in) -->
  <div class="wrap hidden" id="appWrap">
    <header>
      <div>
        <div class="eyebrow">Household · Live list</div>
        <h1>Stock List</h1>
        <p class="sub" id="signedInAs"></p>
      </div>
      <button class="signout-btn" id="signOutBtn" type="button">Sign out</button>
    </header>

    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>

    <div class="list" id="list"></div>

    <form class="add-form" id="addForm">
      <input id="newName" type="text" placeholder="New item name" autocomplete="off" required>
      <input id="newCount" type="number" min="0" step="1" value="1" required>
      <button type="submit">Add item</button>
    </form>
    <div class="error-msg" id="errorMsg"></div>

    <div class="history-section">
      <div class="history-header">
        <h2>History log</h2>
        <button class="download-btn" id="downloadLogBtn" type="button">Download .txt</button>
      </div>
      <div class="history-log" id="historyLog">Loading…</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, sendSignInLinkToEmail, isSignInWithEmailLink,
      signInWithEmailLink, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, deleteDoc, doc,
      updateDoc, onSnapshot, increment, query, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Identifies which list these history entries belong to — change this if
    // you ever reuse this app for a second, separate list.
    const DATABASE_NAME = 'meal_prep';

    // ---------------------------------------------------------------
    // PASTE YOUR OWN FIREBASE CONFIG HERE (see README.md, Step 1-2)
    // ---------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCGxrfmHY-w_O3rbjBdh64P8HL0nZlYLEA",
      authDomain: "household-stock-c9d78.firebaseapp.com",
      projectId: "household-stock-c9d78",
      storageBucket: "household-stock-c9d78.firebasestorage.app",
      messagingSenderId: "829926014511",
      appId: "1:829926014511:web:1a11af405e25a7555dd0da"
    };

    // Where the sign-in email link should send people back to.
    const SIGN_IN_REDIRECT_URL = window.location.href.split('?')[0];
    const EMAIL_STORAGE_KEY = 'householdStockSignInEmail';

    let db, auth;
    const authCard = document.getElementById('authCard');
    const authTitle = document.getElementById('authTitle');
    const authSub = document.getElementById('authSub');
    const authEmail = document.getElementById('authEmail');
    const authBtn = document.getElementById('authBtn');
    const authError = document.getElementById('authError');
    const appWrap = document.getElementById('appWrap');
    const signedInAs = document.getElementById('signedInAs');
    const signOutBtn = document.getElementById('signOutBtn');

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);
    } catch (err) {
      authError.textContent = 'Firebase config missing or invalid — see README.md to finish setup.';
    }

    // --- Handle arriving via the emailed sign-in link ---
    async function completeSignInIfNeeded() {
      if (!auth || !isSignInWithEmailLink(auth, window.location.href)) return;

      let email = window.localStorage.getItem(EMAIL_STORAGE_KEY);
      if (!email) {
        email = window.prompt('Confirm your email to finish signing in:');
      }
      if (!email) return;

      try {
        await signInWithEmailLink(auth, email, window.location.href);
        window.localStorage.removeItem(EMAIL_STORAGE_KEY);
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (err) {
        authError.textContent = 'That sign-in link is invalid or expired. Request a new one below.';
      }
    }

    authBtn.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      authError.textContent = '';
      if (!email) { authError.textContent = 'Enter your email first.'; return; }
      if (!auth) { authError.textContent = 'Firebase is not configured yet.'; return; }

      authBtn.disabled = true;
      try {
        await sendSignInLinkToEmail(auth, email, {
          url: SIGN_IN_REDIRECT_URL,
          handleCodeInApp: true
        });
        window.localStorage.setItem(EMAIL_STORAGE_KEY, email);
        authTitle.textContent = 'Check your email';
        authSub.textContent = `We sent a sign-in link to ${email}. Open it on this device to continue.`;
        authEmail.classList.add('hidden');
        authBtn.classList.add('hidden');
      } catch (err) {
        authError.textContent = 'Could not send the link — check the email and try again.';
        authBtn.disabled = false;
      }
    });

    signOutBtn.addEventListener('click', () => signOut(auth));

    let currentUserEmail = null;
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserEmail = user.email;
        authCard.classList.add('hidden');
        appWrap.classList.remove('hidden');
        signedInAs.textContent = `Signed in as ${user.email}`;
        startListListener();
      } else {
        appWrap.classList.add('hidden');
        authCard.classList.remove('hidden');
      }
    });

    completeSignInIfNeeded();

    // ---------------------------------------------------------------
    // Everything below only runs once signed in AND approved by the
    // Firestore rules' email allowlist (see README.md, Step 5).
    // ---------------------------------------------------------------
    const listEl = document.getElementById('list');
    const addForm = document.getElementById('addForm');
    const newName = document.getElementById('newName');
    const newCount = document.getElementById('newCount');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const errorMsg = document.getElementById('errorMsg');
    const historyLogEl = document.getElementById('historyLog');
    const downloadLogBtn = document.getElementById('downloadLogBtn');

    let latestHistoryLines = [];

    function formatHistoryLine(dateStr, timeStr, user, item, prevQty, newQty) {
      // date, time, user, database name, item name, prev quantity, new quantity
      return `${dateStr}, ${timeStr}, ${user}, ${DATABASE_NAME}, ${item}, ${prevQty}, ${newQty}`;
    }

    async function logChange(itemName, prevQty, newQty) {
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB'); // dd/mm/yyyy
      const timeStr = now.toLocaleTimeString('en-GB', { hour12: false }); // HH:MM:SS
      try {
        await addDoc(collection(db, "history"), {
          date: dateStr,
          time: timeStr,
          user: currentUserEmail || 'unknown',
          database: DATABASE_NAME,
          item: itemName,
          prevQty,
          newQty,
          sortKey: now.getTime()
        });
      } catch (err) {
        // Don't block the main action if logging fails — just surface it quietly.
        console.error('Could not write history entry:', err);
      }
    }

    function startHistoryListener() {
      if (!db) return;
      const historyCol = collection(db, "history");
      const historyQuery = query(historyCol, orderBy("sortKey", "desc"), limit(500));
      onSnapshot(historyQuery,
        (snapshot) => {
          const entries = snapshot.docs.map(d => d.data());
          if (entries.length === 0) {
            historyLogEl.innerHTML = `<div class="empty">No changes logged yet.</div>`;
            latestHistoryLines = [];
            downloadLogBtn.disabled = true;
            return;
          }
          latestHistoryLines = entries.map(en =>
            formatHistoryLine(en.date, en.time, en.user, en.item, en.prevQty, en.newQty)
          );
          historyLogEl.textContent = latestHistoryLines.join('\n');
          downloadLogBtn.disabled = false;
        },
        (err) => {
          historyLogEl.textContent = err.code === 'permission-denied'
            ? "Can't load history — check the Firestore rules include the history collection."
            : `Error loading history: ${err.message}`;
        }
      );
    }

    downloadLogBtn.addEventListener('click', () => {
      if (latestHistoryLines.length === 0) return;
      const blob = new Blob([latestHistoryLines.join('\n')], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${DATABASE_NAME}_history_log.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    let listenerStarted = false;
    function startListListener() {
      if (listenerStarted || !db) return;
      listenerStarted = true;
      const itemsCol = collection(db, "items");

      onSnapshot(itemsCol,
        (snapshot) => {
          statusDot.classList.remove('offline');
          statusText.textContent = 'Live — connected';
          const items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          render(items);
        },
        (err) => {
          statusDot.classList.add('offline');
          statusText.textContent = 'Connection error';
          errorMsg.textContent = err.code === 'permission-denied'
            ? "Your email isn't on the household allowlist yet — ask whoever set this up to add it."
            : err.message;
        }
      );

      listEl.addEventListener('click', async (e) => {
        const itemEl = e.target.closest('.item');
        if (!itemEl) return;
        const id = itemEl.dataset.id;
        const ref = doc(db, "items", id);
        const itemName = itemEl.querySelector('.item-name').textContent;
        const countEl = itemEl.querySelector('.count');
        const current = Number(countEl.textContent);
        try {
          if (e.target.classList.contains('inc')) {
            await updateDoc(ref, { count: increment(1) });
            logChange(itemName, current, current + 1);
          } else if (e.target.classList.contains('dec')) {
            if (current > 0) {
              await updateDoc(ref, { count: increment(-1) });
              logChange(itemName, current, current - 1);
            }
          } else if (e.target.classList.contains('remove-btn')) {
            if (confirm(`Remove "${itemName}" from the list?`)) {
              await deleteDoc(ref);
              logChange(itemName, current, 0);
            }
          }
        } catch (err) {
          errorMsg.textContent = 'Could not save that change — check your connection and try again.';
        }
      });

      addForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = newName.value.trim();
        const count = parseInt(newCount.value, 10) || 0;
        if (!name) return;
        try {
          await addDoc(itemsCol, { name, count });
          logChange(name, 0, count);
          newName.value = '';
          newCount.value = '1';
          newName.focus();
        } catch (err) {
          errorMsg.textContent = 'Could not add that item — check your connection and try again.';
        }
      });

      startHistoryListener();
    }

    function render(items) {
      errorMsg.textContent = '';
      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty">No items yet — add your first one below.</div>`;
        return;
      }
      items.sort((a, b) => a.name.localeCompare(b.name));
      listEl.innerHTML = items.map(item => `
        <div class="item" data-id="${item.id}">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="stepper">
            <button type="button" class="dec" aria-label="Use one ${escapeHtml(item.name)}">−</button>
            <div class="count">${item.count}</div>
            <button type="button" class="inc" aria-label="Add one ${escapeHtml(item.name)}">+</button>
          </div>
          <button type="button" class="remove-btn" aria-label="Remove ${escapeHtml(item.name)}">✕</button>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
