<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #23281f;
    --surface: #2c3226;
    --surface-raised: #343b2c;
    --border: #454d3c;
    --paper: #ede6d6;
    --paper-dim: #a9a190;
    --accent: #7fa06f;
    --accent-bright: #9fc98a;
    --danger: #c0604a;
    --danger-bright: #d97a63;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(159,201,138,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(159,201,138,0.05), transparent 40%);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-bright);
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--paper-dim); font-size: 14px; margin: 0; }

  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--paper-dim);
    margin: 14px 0 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-bright); }
  .dot.offline { background: var(--danger-bright); }

  .list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }

  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  .item::before {
    content: '';
    position: absolute;
    left: 0; top: 10px; bottom: 10px;
    width: 3px;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
  }
  .item-name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .stepper button {
    width: 34px; height: 34px;
    background: transparent;
    border: none;
    color: var(--paper);
    font-size: 18px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }
  .stepper button:hover { background: rgba(159,201,138,0.15); }
  .stepper button:active { background: rgba(159,201,138,0.28); }
  .count {
    min-width: 36px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
  }
  .remove-btn {
    width: 32px; height: 32px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--danger-bright);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    flex-shrink: 0;
  }
  .remove-btn:hover { background: rgba(192,96,74,0.15); border-color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--paper-dim);
    font-size: 13px;
    padding: 30px 10px;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .add-form input {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--paper);
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .add-form input:focus { outline: 2px solid var(--accent-bright); outline-offset: 1px; }
  #newName { flex: 1; min-width: 140px; }
  #newCount { width: 70px; font-family: 'IBM Plex Mono', monospace; }
  .add-form button {
    background: var(--accent);
    border: none;
    color: #16210f;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .add-form button:hover { background: var(--accent-bright); }
  .add-form button:disabled { opacity: 0.5; cursor: default; }

  .error-msg {
    color: var(--danger-bright);
    font-size: 12.5px;
    margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (prefers-reduced-motion: no-preference) {
    .item { transition: transform 0.15s ease, opacity 0.15s ease; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Household · Live list</div>
      <h1>Stock List</h1>
      <p class="sub">Shared with everyone who has this link. Changes appear for everyone within a second or two.</p>
    </header>

    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>

    <div class="list" id="list"></div>

    <form class="add-form" id="addForm">
      <input id="newName" type="text" placeholder="New item name" autocomplete="off" required>
      <input id="newCount" type="number" min="0" step="1" value="1" required>
      <button type="submit">Add item</button>
    </form>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, deleteDoc, doc,
      updateDoc, onSnapshot, increment
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ---------------------------------------------------------------
    // PASTE YOUR OWN FIREBASE CONFIG HERE (see README.md, Step 1-2)
    // ---------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCGxrfmHY-w_O3rbjBdh64P8HL0nZlYLEA",
      authDomain: "household-stock-c9d78.firebaseapp.com",
      projectId: "household-stock-c9d78",
      storageBucket: "household-stock-c9d78.firebasestorage.app",
      messagingSenderId: "829926014511",
      appId: "1:829926014511:web:1a11af405e25a7555dd0da"
    };

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const errorMsg = document.getElementById('errorMsg');

    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (err) {
      statusDot.classList.add('offline');
      statusText.textContent = 'Not connected';
      errorMsg.textContent = 'Firebase config missing or invalid — see README.md to finish setup.';
    }

    const itemsCol = db ? collection(db, "items") : null;
    const listEl = document.getElementById('list');
    const addForm = document.getElementById('addForm');
    const newName = document.getElementById('newName');
    const newCount = document.getElementById('newCount');

    function render(items) {
      errorMsg.textContent = '';
      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty">No items yet — add your first one below.</div>`;
        return;
      }
      items.sort((a, b) => a.name.localeCompare(b.name));
      listEl.innerHTML = items.map(item => `
        <div class="item" data-id="${item.id}">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="stepper">
            <button type="button" class="dec" aria-label="Use one ${escapeHtml(item.name)}">−</button>
            <div class="count">${item.count}</div>
            <button type="button" class="inc" aria-label="Add one ${escapeHtml(item.name)}">+</button>
          </div>
          <button type="button" class="remove-btn" aria-label="Remove ${escapeHtml(item.name)}">✕</button>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    listEl.addEventListener('click', async (e) => {
      const itemEl = e.target.closest('.item');
      if (!itemEl) return;
      const id = itemEl.dataset.id;
      const ref = doc(db, "items", id);
      try {
        if (e.target.classList.contains('inc')) {
          await updateDoc(ref, { count: increment(1) });
        } else if (e.target.classList.contains('dec')) {
          const countEl = itemEl.querySelector('.count');
          const current = Number(countEl.textContent);
          if (current > 0) await updateDoc(ref, { count: increment(-1) });
        } else if (e.target.classList.contains('remove-btn')) {
          if (confirm(`Remove "${itemEl.querySelector('.item-name').textContent}" from the list?`)) {
            await deleteDoc(ref);
          }
        }
      } catch (err) {
        errorMsg.textContent = 'Could not save that change — check your connection and try again.';
      }
    });

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = newName.value.trim();
      const count = parseInt(newCount.value, 10) || 0;
      if (!name) return;
      try {
        await addDoc(itemsCol, { name, count });
        newName.value = '';
        newCount.value = '1';
        newName.focus();
      } catch (err) {
        errorMsg.textContent = 'Could not add that item — check your connection and try again.';
      }
    });

    if (db) {
      onSnapshot(itemsCol,
        (snapshot) => {
          statusDot.classList.remove('offline');
          statusText.textContent = 'Live — connected';
          const items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          render(items);
        },
        (err) => {
          statusDot.classList.add('offline');
          statusText.textContent = 'Connection error';
          errorMsg.textContent = err.message;
        }
      );
    }
  </script>
</body>
</html>
