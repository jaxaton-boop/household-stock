<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock List — Household Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Sign-in screen -->
  <div class="auth-card" id="authCard">
    <div class="eyebrow" style="text-align:left;margin-bottom:14px;">Household · Live list</div>
    <h2 id="authTitle">Sign in to view the list</h2>
    <p id="authSub">Enter the email and password you were given. Only invited household accounts can access this list.</p>
    <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="username">
    <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="authBtn" type="button">Sign in</button>
    <div class="error-msg" id="authError"></div>
    <div class="auth-note"><a href="#" id="forgotPasswordLink" style="color:var(--paper-dim);">Forgot your password?</a></div>
  </div>

  <!-- Main app shell (shown once signed in) -->
  <div class="app-shell hidden" id="appWrap">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">Household</div>
      <div id="sidebarNav"></div>
    </nav>

    <div class="page-content">
      <div class="wrap">
        <header>
          <div>
            <div class="eyebrow">Household · Live list</div>
            <h1>Stock List</h1>
            <p class="sub" id="signedInAs"></p>
          </div>
          <button class="signout-btn" id="signOutBtn" type="button">Sign out</button>
        </header>

        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>

        <div class="list" id="list"></div>

        <form class="add-form" id="addForm">
          <input id="newName" type="text" placeholder="New item name" autocomplete="off" required>
          <input id="newCount" type="number" min="0" step="1" value="1" required>
          <button type="submit">Add item</button>
        </form>
        <div class="error-msg" id="errorMsg"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      db, logChange, escapeHtml, initAuthGate
    } from "./app-shared.js";
    import {
      collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, increment
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const listEl = document.getElementById('list');
    const addForm = document.getElementById('addForm');
    const newName = document.getElementById('newName');
    const newCount = document.getElementById('newCount');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const errorMsg = document.getElementById('errorMsg');

    let listenerStarted = false;
    function startListListener() {
      if (listenerStarted || !db) return;
      listenerStarted = true;
      const itemsCol = collection(db, "items");

      onSnapshot(itemsCol,
        (snapshot) => {
          statusDot.classList.remove('offline');
          statusText.textContent = 'Live — connected';
          const items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          render(items);
        },
        (err) => {
          statusDot.classList.add('offline');
          statusText.textContent = 'Connection error';
          errorMsg.textContent = err.code === 'permission-denied'
            ? "Your account isn't on the household allowlist yet — ask whoever set this up to add it."
            : err.message;
        }
      );

      listEl.addEventListener('click', async (e) => {
        const itemEl = e.target.closest('.item');
        if (!itemEl) return;
        const id = itemEl.dataset.id;
        const ref = doc(db, "items", id);
        const itemName = itemEl.querySelector('.item-name').textContent;
        const countEl = itemEl.querySelector('.count');
        const current = Number(countEl.textContent);
        try {
          if (e.target.classList.contains('inc')) {
            await updateDoc(ref, { count: increment(1) });
            logChange(itemName, current, current + 1);
          } else if (e.target.classList.contains('dec')) {
            if (current > 0) {
              await updateDoc(ref, { count: increment(-1) });
              logChange(itemName, current, current - 1);
            }
          } else if (e.target.classList.contains('remove-btn')) {
            if (confirm(`Remove "${itemName}" from the list?`)) {
              await deleteDoc(ref);
              logChange(itemName, current, 0);
            }
          }
        } catch (err) {
          errorMsg.textContent = 'Could not save that change — check your connection and try again.';
        }
      });

      addForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = newName.value.trim();
        const count = parseInt(newCount.value, 10) || 0;
        if (!name) return;
        try {
          await addDoc(itemsCol, { name, count });
          logChange(name, 0, count);
          newName.value = '';
          newCount.value = '1';
          newName.focus();
        } catch (err) {
          errorMsg.textContent = 'Could not add that item — check your connection and try again.';
        }
      });
    }

    function render(items) {
      errorMsg.textContent = '';
      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty">No items yet — add your first one below.</div>`;
        return;
      }
      items.sort((a, b) => a.name.localeCompare(b.name));
      listEl.innerHTML = items.map(item => `
        <div class="item" data-id="${item.id}">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="stepper">
            <button type="button" class="dec" aria-label="Use one ${escapeHtml(item.name)}">−</button>
            <div class="count">${item.count}</div>
            <button type="button" class="inc" aria-label="Add one ${escapeHtml(item.name)}">+</button>
          </div>
          <button type="button" class="remove-btn" aria-label="Remove ${escapeHtml(item.name)}">✕</button>
        </div>
      `).join('');
    }

    initAuthGate({ activePage: 'index.html', onSignedIn: startListListener });
  </script>
</body>
</html>
